name: dark_hours
description: "Текстовый квест о выживании в блекаут"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/weapons.json
    - assets/data/tools.json
    - assets/data/consumables.json
    - assets/data/armor.json
    - assets/data/resources.json
    - assets/data/recipes.json