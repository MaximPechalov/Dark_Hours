name: dark_hours
description: "Текстовый квест о выживании в блекаут"
publish_to: 'none'
version: 0.6.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  audioplayers: ^6.1.0
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # ===== ШРИФТЫ =====
  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/RobotoMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700

  # ===== АССЕТЫ =====
  assets:
    # ===== БАЗОВЫЕ ДАННЫЕ =====
    - assets/data/weapons.json
    - assets/data/tools.json
    - assets/data/consumables.json
    - assets/data/armor.json
    - assets/data/resources.json
    - assets/data/recipes.json
    - assets/data/conditions.json
    - assets/data/search_events.json
    - assets/data/achievements.json
    - assets/data/enemies.json

    # ===== ЛОКАЦИИ (по регионам) =====
    - assets/data/locations/

    # ===== СЮЖЕТ =====
    - assets/data/story/boris/chapter_1/
    - assets/data/story/boris/chapter_1/maps/
    - assets/data/story/boris/chapter_1/side_quests/
    - assets/data/story/alina/chapter_1/
    - assets/data/story/ivan/chapter_1/
    - assets/data/story/andrey/chapter_1/
    - assets/data/story/darya/chapter_1/

    # ===== ИКОНКИ ПРЕДМЕТОВ =====
    - assets/images/items/weapons/
    - assets/images/items/tools/
    - assets/images/items/resources/

    # ===== ПОРТРЕТЫ ПЕРСОНАЖЕЙ =====
    - assets/images/characters/

    # ===== ЗВУКИ =====
    - assets/audio/ui/
    - assets/audio/ambience/
    - assets/audio/music/